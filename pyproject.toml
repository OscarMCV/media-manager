[project]
name = "media-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "OscarMCV", email = "oscarm.cabrerav@gmail.com" }]
requires-python = ">=3.8"
dependencies = [
    "boto3>=1.37.6",
    "broadcaster[redis]>=0.3.1",
    "pydantic>=2.10.6",
    "typing-extensions>=4.12.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[dependency-groups]
dev = [
    "coverage>=7.6.1",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.24.0",
    "pytest-dotenv>=0.5.2",
]

[tool.pytest.ini_options]
env_files = [".env"]
